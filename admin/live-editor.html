<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Editor — EcomStore</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bar: #18181b;
      --bar-border: #2d2d30;
      --bar-text: #e4e4e7;
      --bar-muted: #a1a1aa;
      --bar-hover: #27272a;
      --bar-active: #3f3f46;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --panel-bg: #1c1c1f;
      --panel-border: #2d2d30;
      --panel-text: #e4e4e7;
      --panel-muted: #a1a1aa;
      --panel-input-bg: #27272a;
      --panel-input-border: #3f3f46;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f10; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* ── TOP BAR ── */
    .topbar {
      height: 52px; background: var(--bar); border-bottom: 1px solid var(--bar-border);
      display: flex; align-items: center; gap: 0; flex-shrink: 0; z-index: 100;
    }
    .topbar-brand {
      padding: 0 20px; font-weight: 700; font-size: 0.9rem; color: var(--bar-text);
      border-right: 1px solid var(--bar-border); height: 100%; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .topbar-brand span { color: var(--accent); }

    .page-picker {
      padding: 0 12px; display: flex; align-items: center; gap: 8px;
      border-right: 1px solid var(--bar-border); height: 100%;
    }
    .page-picker label { font-size: 0.78rem; color: var(--bar-muted); }
    .page-picker select {
      background: var(--bar-active); color: var(--bar-text); border: 1px solid var(--bar-border);
      border-radius: 6px; padding: 5px 10px; font-size: 0.82rem; cursor: pointer;
    }

    .topbar-tools { display: flex; align-items: center; gap: 2px; padding: 0 8px; flex: 1; }
    .tool-btn {
      background: none; border: none; color: var(--bar-muted); cursor: pointer;
      padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;
      transition: background 0.15s, color 0.15s; white-space: nowrap;
    }
    .tool-btn:hover { background: var(--bar-hover); color: var(--bar-text); }
    .tool-btn.active { background: var(--bar-active); color: var(--bar-text); }
    .tool-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .tool-btn .badge { background: var(--danger); color: white; border-radius: 4px; padding: 1px 5px; font-size: 0.68rem; font-weight: 700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; padding: 0 12px; margin-left: auto; border-left: 1px solid var(--bar-border); }
    .viewport-btns { display: flex; gap: 2px; background: var(--bar-active); border-radius: 6px; padding: 2px; }
    .vp-btn { background: none; border: none; color: var(--bar-muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 0.78rem; transition: all 0.15s; }
    .vp-btn.active { background: var(--bar); color: var(--bar-text); }
    .btn-publish { background: var(--accent); color: white; border: none; padding: 7px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn-publish:hover { background: var(--accent-hover); }
    .btn-publish:disabled { opacity: 0.45; cursor: not-allowed; }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bar-muted); transition: background 0.3s; flex-shrink: 0; }
    .save-dot.unsaved { background: #f59e0b; }
    .save-dot.saved { background: var(--success); }

    /* ── MAIN WORKSPACE ── */
    .workspace { flex: 1; display: flex; overflow: hidden; }

    /* ── CANVAS ── */
    .canvas-wrap {
      flex: 1; display: flex; align-items: flex-start; justify-content: center;
      background: #141416; overflow: auto; padding: 20px;
    }
    .canvas-frame {
      background: white; box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
      border-radius: 4px; overflow: hidden; position: relative;
      transition: width 0.3s ease; width: 100%; max-width: 1440px;
    }
    .canvas-frame.tablet { max-width: 768px; }
    .canvas-frame.mobile { max-width: 390px; }
    .canvas-frame iframe { width: 100%; border: none; display: block; min-height: 600px; }

    /* ── RIGHT PANEL ── */
    .edit-panel {
      width: 0; background: var(--panel-bg); border-left: 1px solid var(--panel-border);
      overflow: hidden; transition: width 0.25s ease; flex-shrink: 0;
      display: flex; flex-direction: column;
    }
    .edit-panel.open { width: 320px; }

    .panel-head {
      padding: 16px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center;
    }
    .panel-head h3 { font-size: 0.88rem; font-weight: 600; color: var(--panel-text); }
    .panel-close { background: none; border: none; color: var(--panel-muted); cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 2px 6px; border-radius: 4px; }
    .panel-close:hover { background: var(--bar-active); color: var(--panel-text); }

    .panel-body { flex: 1; overflow-y: auto; padding: 16px; }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--bar-active); border-radius: 4px; }

    .field-group { margin-bottom: 16px; }
    .field-group label { display: block; font-size: 0.75rem; color: var(--panel-muted); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .field-group input[type="text"],
    .field-group input[type="url"],
    .field-group textarea,
    .field-group select {
      width: 100%; background: var(--panel-input-bg); border: 1px solid var(--panel-input-border);
      border-radius: 6px; color: var(--panel-text); font-size: 0.85rem; padding: 8px 10px;
      font-family: inherit; transition: border-color 0.15s; resize: vertical;
    }
    .field-group input:focus, .field-group textarea:focus, .field-group select:focus {
      outline: none; border-color: var(--accent);
    }
    .color-row { display: flex; gap: 8px; align-items: center; }
    .color-row input[type="color"] { width: 36px; height: 36px; border: 1px solid var(--panel-input-border); border-radius: 6px; cursor: pointer; background: none; padding: 2px; }
    .color-row input[type="text"] { flex: 1; }

    .img-preview { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; margin-top: 6px; border: 1px solid var(--panel-input-border); display: none; }
    .img-preview.show { display: block; }

    .panel-actions { padding: 12px 16px; border-top: 1px solid var(--panel-border); display: flex; gap: 8px; }
    .panel-actions button { flex: 1; padding: 8px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; }
    .btn-apply { background: var(--accent); color: white; }
    .btn-apply:hover { background: var(--accent-hover); }
    .btn-cancel-edit { background: var(--bar-active); color: var(--panel-text); }
    .btn-cancel-edit:hover { background: var(--bar-hover); }

    /* ── EDIT HIGHLIGHT OVERLAY ── */
    .highlight-overlay {
      position: absolute; pointer-events: none; border: 2px solid var(--accent);
      border-radius: 4px; transition: all 0.1s; display: none; z-index: 9999;
    }
    .highlight-label {
      position: absolute; top: -24px; left: 0; background: var(--accent); color: white;
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 3px; white-space: nowrap;
    }
    .edit-toolbar {
      position: absolute; top: -36px; right: 0; background: var(--bar);
      border: 1px solid var(--bar-border); border-radius: 6px; display: flex; gap: 2px; padding: 3px;
    }
    .et-btn {
      background: none; border: none; color: var(--bar-muted); cursor: pointer;
      padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; transition: all 0.15s;
    }
    .et-btn:hover { background: var(--bar-active); color: var(--bar-text); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: var(--bar); color: var(--bar-text); padding: 10px 20px; border-radius: 8px;
      font-size: 0.85rem; font-weight: 500; border: 1px solid var(--bar-border);
      transition: transform 0.25s ease; z-index: 9999; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* ── LOADING ── */
    .loading-bar { height: 2px; background: var(--accent); width: 0; transition: width 0.4s ease; position: absolute; top: 0; left: 0; right: 0; z-index: 200; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-brand">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
    Ecom<span>Editor</span>
  </div>

  <div class="page-picker">
    <label>Page</label>
    <select id="pageSelect" onchange="changePage()">
      <option value="/">Homepage</option>
      <option value="/pages/products.html">Products</option>
      <option value="/pages/product.html?id=1">Product detail</option>
      <option value="/pages/cart.html">Cart</option>
    </select>
  </div>

  <div class="topbar-tools">
    <button class="tool-btn active" id="btnEditMode" onclick="setMode('edit')" title="Edit mode">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit
    </button>
    <button class="tool-btn" id="btnPreviewMode" onclick="setMode('preview')" title="Preview (no edit handles)">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Preview
    </button>

    <div style="width:1px;height:24px;background:var(--bar-border);margin:0 6px"></div>

    <button class="tool-btn" onclick="undo()" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
      Undo
    </button>
    <button class="tool-btn" onclick="redo()" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 0 4-4h12"/></svg>
      Redo
    </button>

    <div style="width:1px;height:24px;background:var(--bar-border);margin:0 6px"></div>

    <button class="tool-btn" onclick="reloadFrame()" title="Reload iframe">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Reload
    </button>

    <span id="undoCount" class="tool-btn" style="cursor:default;opacity:0.5;font-size:0.75rem;padding:6px 8px"></span>
  </div>

  <div class="topbar-right">
    <div class="viewport-btns">
      <button class="vp-btn active" onclick="setViewport('desktop')" title="Desktop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      </button>
      <button class="vp-btn" onclick="setViewport('tablet')" title="Tablet">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </button>
      <button class="vp-btn" onclick="setViewport('mobile')" title="Mobile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </button>
    </div>
    <div class="save-dot" id="saveDot" title="Save status"></div>
    <button class="btn-publish" id="btnPublish" onclick="publishChanges()" disabled>Publish</button>
  </div>
</div>

<!-- WORKSPACE -->
<div class="workspace">

  <!-- CANVAS -->
  <div class="canvas-wrap">
    <div class="canvas-frame" id="canvasFrame">
      <div class="loading-bar" id="loadingBar"></div>
      <div class="highlight-overlay" id="highlight">
        <div class="highlight-label" id="highlightLabel"></div>
        <div class="edit-toolbar">
          <button class="et-btn" onclick="openEditPanel()">Edit</button>
          <button class="et-btn" onclick="makeEditable()">Inline</button>
        </div>
      </div>
      <iframe id="siteFrame" src="/" onload="onFrameLoad()"></iframe>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="edit-panel" id="editPanel">
    <div class="panel-head">
      <h3 id="panelTitle">Edit element</h3>
      <button class="panel-close" onclick="closePanel()">×</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-actions">
      <button class="btn-cancel-edit" onclick="closePanel()">Cancel</button>
      <button class="btn-apply" onclick="applyEdits()">Apply</button>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
'use strict';

const frame = () => document.getElementById('siteFrame');
const frameDoc = () => frame().contentDocument;
const canvasFrame = document.getElementById('canvasFrame');
const highlight = document.getElementById('highlight');
const highlightLabel = document.getElementById('highlightLabel');
const editPanel = document.getElementById('editPanel');
const panelBody = document.getElementById('panelBody');
const panelTitle = document.getElementById('panelTitle');
const saveDot = document.getElementById('saveDot');
const btnPublish = document.getElementById('btnPublish');
const undoCountEl = document.getElementById('undoCount');

let mode = 'edit';
let frameReady = false;
let activeEl = null;
let undoStack = [];
let redoStack = [];
let pendingChanges = {};
let editingFields = {};

function onFrameLoad() {
  frameReady = true;
  document.getElementById('loadingBar').style.width = '0';
  if (mode === 'edit') setupEditMode();
  syncIframeHeight();
  toast('Page loaded', 'success');
}

function syncIframeHeight() {
  try {
    const h = frameDoc().body.scrollHeight;
    frame().style.height = Math.max(h, 600) + 'px';
  } catch(e) {}
  setTimeout(syncIframeHeight, 1000);
}

// ── EDIT MODE SETUP ──
function setupEditMode() {
  if (!frameReady) return;
  try {
    const doc = frameDoc();

    // Inject editor styles into iframe
    let style = doc.getElementById('__editor_styles');
    if (!style) {
      style = doc.createElement('style');
      style.id = '__editor_styles';
      doc.head.appendChild(style);
    }
    style.textContent = `
      [data-editable]:hover { outline: 2px dashed #3b82f6 !important; outline-offset: 2px; cursor: pointer !important; }
      [data-editable].editing { outline: 2px solid #3b82f6 !important; outline-offset: 2px; }
      [contenteditable="true"] { outline: 2px solid #22c55e !important; outline-offset: 2px; cursor: text !important; }
    `;

    // Tag editable elements
    const selectors = [
      { sel: '.slide-title', type: 'text', label: 'Slide title' },
      { sel: '.slide-subtitle', type: 'text', label: 'Slide subtitle' },
      { sel: '.btn-slide', type: 'text', label: 'Slide button' },
      { sel: '.offer-content h3', type: 'text', label: 'Banner heading' },
      { sel: '.offer-content p:not(.offer-tag)', type: 'text', label: 'Banner text' },
      { sel: '.offer-tag', type: 'text', label: 'Offer tag' },
      { sel: '.btn-offer', type: 'text', label: 'Banner button' },
      { sel: '.offer-banner', type: 'bg', label: 'Banner background' },
      { sel: '.section-header h2', type: 'text', label: 'Section title' },
      { sel: '.section-header p:not(.view-all-link)', type: 'text', label: 'Section subtitle' },
      { sel: '.feature-card h3', type: 'text', label: 'Feature title' },
      { sel: '.feature-card p', type: 'text', label: 'Feature text' },
      { sel: '.feature-card .feature-icon', type: 'text', label: 'Feature icon' },
      { sel: '.feature-card', type: 'bg', label: 'Feature card bg' },
      { sel: '.newsletter-text h2', type: 'text', label: 'Newsletter title' },
      { sel: '.newsletter-text p', type: 'text', label: 'Newsletter subtitle' },
      { sel: '.slide', type: 'slide', label: 'Slide' },
      { sel: '.slide-image img', type: 'image', label: 'Slide image' },
      { sel: '[data-editable]', type: 'auto', label: 'Editable' }
    ];

    selectors.forEach(({ sel, type, label }) => {
      doc.querySelectorAll(sel).forEach((el, i) => {
        // Only set if not already set by HTML attribute
        if (!el.dataset.editable && type !== 'auto') {
          el.dataset.editable = type;
          el.dataset.editLabel = label + (doc.querySelectorAll(sel).length > 1 ? ` ${i + 1}` : '');
        } else if (type === 'auto' && !el.dataset.editLabel) {
          el.dataset.editLabel = label;
        }
        el.removeEventListener('click', handleElClick);
        el.addEventListener('click', handleElClick);
        el.removeEventListener('mouseenter', handleElHover);
        el.addEventListener('mouseenter', handleElHover);
        el.removeEventListener('mouseleave', handleElLeave);
        el.addEventListener('mouseleave', handleElLeave);
      });
    });

  } catch(e) { console.warn('Edit setup error:', e); }
}

function handleElClick(e) {
  if (this.contentEditable === 'true') return;
  e.preventDefault(); e.stopPropagation();
  selectElement(this);
}

function handleElHover() { positionHighlight(this); }
function handleElLeave() { if (this !== activeEl) { /* keep highlight if active */ } }

function selectElement(el) {
  if (activeEl) activeEl.classList.remove('editing');
  activeEl = el;
  el.classList.add('editing');
  positionHighlight(el);
}

function positionHighlight(el) {
  try {
    const frameRect = frame().getBoundingClientRect();
    const canvasRect = canvasFrame.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    // elRect is relative to iframe's viewport
    const scrollY = frameDoc().documentElement.scrollTop || frameDoc().body.scrollTop;

    const top = frameRect.top - canvasRect.top + elRect.top + scrollY - canvasFrame.scrollTop;
    const left = frameRect.left - canvasRect.left + elRect.left;

    highlight.style.cssText = `
      display:block; top:${top}px; left:${left}px;
      width:${elRect.width}px; height:${elRect.height}px;
    `;
    highlightLabel.textContent = el.dataset.editLabel || el.tagName.toLowerCase();
  } catch(e) {}
}

function cancelHighlight() {
  highlight.style.display = 'none';
  if (activeEl) { activeEl.classList.remove('editing'); activeEl = null; }
  closePanel();
}

// ── INLINE EDITING ──
function makeEditable() {
  if (!activeEl) return;
  const type = activeEl.dataset.editable;
  if (type === 'bg' || type === 'slide' || type === 'image') {
    openEditPanel(); return;
  }
  activeEl.contentEditable = 'true';
  activeEl.focus();

  const sel = frameDoc().getSelection();
  const range = frameDoc().createRange();
  range.selectNodeContents(activeEl);
  sel.removeAllRanges();
  sel.addRange(range);

  const originalText = activeEl.textContent;
  activeEl.addEventListener('blur', function onBlur() {
    activeEl.removeEventListener('blur', onBlur);
    activeEl.contentEditable = 'false';
    const newText = activeEl.textContent;
    if (newText !== originalText) {
      pushUndo({ el: activeEl, prop: 'textContent', old: originalText, val: newText });
      queueChange(activeEl, 'text', newText);
    }
  }, { once: true });

  toast('Type to edit, click away to save');
}

// ── PANEL EDITING ──
function openEditPanel() {
  if (!activeEl) return;
  const type = activeEl.dataset.editable;
  const label = activeEl.dataset.editLabel || 'Element';
  panelTitle.textContent = `Edit: ${label}`;
  editingFields = {};

  let html = '';

  if (type === 'text') {
    const txt = activeEl.textContent.trim();
    html += field('Text content', `<textarea id="ef_text" rows="3">${escHtml(txt)}</textarea>`);
    html += field('Text color', colorField('ef_color', rgbToHex(getComputedStyle(activeEl, null).color)));
    editingFields.text = { prop: 'textContent', key: 'ef_text' };
    editingFields.color = { prop: 'style.color', key: 'ef_color' };
  }

  if (type === 'bg') {
    const bg = getComputedStyle(activeEl, null).background;
    const bgColor = getComputedStyle(activeEl, null).backgroundColor;
    html += field('Background color', colorField('ef_bg', rgbToHex(bgColor)));
    html += field('Gradient (CSS)', `<input type="text" id="ef_gradient" value="${escHtml(extractGradient(activeEl))}" placeholder="linear-gradient(135deg,#667eea,#764ba2)">`);
    editingFields.bg = { prop: 'style.background', key: 'ef_gradient', fallbackKey: 'ef_bg' };
  }

  if (type === 'image') {
    const src = activeEl.src || '';
    html += field('Image URL', `<input type="url" id="ef_img" value="${escHtml(src)}" placeholder="https://…"><img class="img-preview ${src ? 'show' : ''}" id="imgPreview" src="${escHtml(src)}">`);
    editingFields.image = { prop: 'src', key: 'ef_img' };
  }

  if (type === 'slide') {
    const titleEl = activeEl.querySelector('.slide-title');
    const subEl = activeEl.querySelector('.slide-subtitle');
    const btnEl = activeEl.querySelector('.btn-slide');
    html += field('Title', `<input type="text" id="ef_stitle" value="${escHtml(titleEl ? titleEl.textContent.trim() : '')}">`);
    html += field('Subtitle', `<input type="text" id="ef_ssub" value="${escHtml(subEl ? subEl.textContent.trim() : '')}">`);
    html += field('Button text', `<input type="text" id="ef_sbtn" value="${escHtml(btnEl ? btnEl.textContent.trim() : '')}">`);
    html += field('Button link', `<input type="url" id="ef_sbtnlink" value="${escHtml(btnEl ? btnEl.href : '')}">`);
    html += field('Background', colorField('ef_sbg', extractFirstColor(activeEl)));
    editingFields.slide = {
      title: 'ef_stitle', sub: 'ef_ssub', btn: 'ef_sbtn', btnlink: 'ef_sbtnlink', bg: 'ef_sbg'
    };
  }

  panelBody.innerHTML = html || '<p style="color:var(--panel-muted);font-size:0.85rem">No editable properties for this element.</p>';

  // Live preview for color pickers
  panelBody.querySelectorAll('input[type="color"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const textInp = document.getElementById(inp.id.replace('_cp', ''));
      if (textInp) textInp.value = inp.value;
      livePreview();
    });
  });

  panelBody.querySelectorAll('input[type="text"], input[type="url"], textarea').forEach(inp => {
    inp.addEventListener('input', () => {
      const cpInp = document.getElementById(inp.id + '_cp');
      if (cpInp && inp.value.startsWith('#')) cpInp.value = inp.value;
      if (inp.id === 'ef_img') {
        const prev = document.getElementById('imgPreview');
        if (prev) { prev.src = inp.value; prev.classList.toggle('show', !!inp.value); }
      }
      livePreview();
    });
  });

  editPanel.classList.add('open');
}

function livePreview() {
  if (!activeEl) return;
  const f = editingFields;
  if (f.text) activeEl.textContent = val('ef_text') || activeEl.textContent;
  if (f.color) activeEl.style.color = val('ef_color') || '';
  if (f.bg) {
    const grad = val('ef_gradient');
    activeEl.style.background = grad || val('ef_bg') || '';
  }
  if (f.image) activeEl.src = val('ef_img') || activeEl.src;
  if (f.slide) {
    const t = activeEl.querySelector('.slide-title');
    const s = activeEl.querySelector('.slide-subtitle');
    const b = activeEl.querySelector('.btn-slide');
    if (t) t.textContent = val('ef_stitle') || t.textContent;
    if (s) s.textContent = val('ef_ssub') || s.textContent;
    if (b) { b.textContent = val('ef_sbtn') || b.textContent; b.href = val('ef_sbtnlink') || b.href; }
    activeEl.style.background = val('ef_sbg') || activeEl.style.background;
  }
}

function applyEdits() {
  livePreview();
  pushUndo({ snapshot: captureState() });
  queueChangeFromPanel();
  closePanel();
  markUnsaved();
  toast('Changes applied', 'success');
}

function queueChangeFromPanel() {
  if (!activeEl) return;
  const id = elementId(activeEl);
  pendingChanges[id] = pendingChanges[id] || { selector: cssSel(activeEl), changes: {} };
  const f = editingFields;
  if (f.text) pendingChanges[id].changes.textContent = val('ef_text');
  if (f.color) pendingChanges[id].changes.color = val('ef_color');
  if (f.bg) pendingChanges[id].changes.background = val('ef_gradient') || val('ef_bg');
  if (f.image) pendingChanges[id].changes.src = val('ef_img');
  if (f.slide) {
    pendingChanges[id].changes.slideTitle = val('ef_stitle');
    pendingChanges[id].changes.slideSub = val('ef_ssub');
    pendingChanges[id].changes.slideBtn = val('ef_sbtn');
    pendingChanges[id].changes.slideBtnLink = val('ef_sbtnlink');
    pendingChanges[id].changes.slideBackground = val('ef_sbg');
  }
}

function queueChange(el, type, value) {
  const id = elementId(el);
  pendingChanges[id] = pendingChanges[id] || { selector: cssSel(el), changes: {} };
  pendingChanges[id].changes[type] = value;
  markUnsaved();
}

function closePanel() {
  editPanel.classList.remove('open');
  editingFields = {};
}

// ── UNDO/REDO ──
let snapshotBefore = null;

function captureState() {
  try { return frameDoc().body.innerHTML; } catch(e) { return ''; }
}

function pushUndo(entry) {
  undoStack.push(entry);
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
  updateUndoCount();
}

function undo() {
  if (!undoStack.length) { toast('Nothing to undo'); return; }
  redoStack.push(captureState());
  const entry = undoStack.pop();
  if (entry.snapshot) {
    try { frameDoc().body.innerHTML = entry.snapshot; setupEditMode(); }
    catch(e) {}
  } else if (entry.el && entry.prop) {
    try {
      const parts = entry.prop.split('.');
      let target = entry.el;
      for (let i = 0; i < parts.length - 1; i++) target = target[parts[i]];
      target[parts[parts.length - 1]] = entry.old;
    } catch(e) {}
  }
  updateUndoCount();
  toast('Undone');
}

function redo() {
  if (!redoStack.length) { toast('Nothing to redo'); return; }
  undoStack.push({ snapshot: captureState() });
  const snapshot = redoStack.pop();
  try { frameDoc().body.innerHTML = snapshot; setupEditMode(); }
  catch(e) {}
  updateUndoCount();
  toast('Redone');
}

function updateUndoCount() {
  undoCountEl.textContent = undoStack.length ? `${undoStack.length} changes` : '';
}

// ── PUBLISH ──
async function publishChanges() {
  if (!Object.keys(pendingChanges).length) return;
  btnPublish.disabled = true; btnPublish.textContent = 'Publishing…';
  document.getElementById('loadingBar').style.width = '60%';

  try {
    const res = await fetch('/api/cms/live-edits', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: document.getElementById('pageSelect').value, changes: pendingChanges })
    });
    document.getElementById('loadingBar').style.width = '100%';
    setTimeout(() => document.getElementById('loadingBar').style.width = '0', 400);

    if (res.ok) {
      pendingChanges = {};
      markSaved();
      toast('Published!', 'success');
    } else {
      toast('Publish failed — check console', 'error');
    }
  } catch(e) {
    toast('Network error', 'error');
  } finally {
    btnPublish.textContent = 'Publish';
    btnPublish.disabled = !Object.keys(pendingChanges).length;
  }
}

function markUnsaved() {
  saveDot.className = 'save-dot unsaved';
  btnPublish.disabled = false;
}
function markSaved() {
  saveDot.className = 'save-dot saved';
  btnPublish.disabled = true;
}

// ── MODE / VIEWPORT ──
function setMode(m) {
  mode = m;
  document.getElementById('btnEditMode').classList.toggle('active', m === 'edit');
  document.getElementById('btnPreviewMode').classList.toggle('active', m === 'preview');
  if (frameReady) {
    try {
      const s = frameDoc().getElementById('__editor_styles');
      if (s) s.textContent = m === 'edit' ? s.textContent : '';
    } catch(e) {}
  }
  cancelHighlight();
  if (m === 'edit' && frameReady) setupEditMode();
}

function setViewport(vp) {
  const frame = document.getElementById('canvasFrame');
  document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
  event.target.closest('.vp-btn').classList.add('active');
  frame.className = 'canvas-frame' + (vp !== 'desktop' ? ` ${vp}` : '');
}

function changePage() {
  const url = document.getElementById('pageSelect').value;
  document.getElementById('loadingBar').style.width = '40%';
  frame().src = url;
  cancelHighlight();
  closePanel();
}

function reloadFrame() {
  frame().src = frame().src;
  cancelHighlight();
  closePanel();
}

// ── HELPERS ──
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function field(label, inputHtml) {
  return `<div class="field-group"><label>${label}</label>${inputHtml}</div>`;
}

function colorField(id, hex) {
  return `<div class="color-row">
    <input type="color" id="${id}_cp" value="${hex}" title="Pick color">
    <input type="text" id="${id}" value="${hex}" placeholder="#ffffff" maxlength="7">
  </div>`;
}

function rgbToHex(rgb) {
  if (!rgb || rgb === 'transparent') return '#ffffff';
  if (rgb.startsWith('#')) return rgb;
  const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '#ffffff';
  return '#' + [m[1], m[2], m[3]].map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
}

function extractGradient(el) {
  try {
    const bg = el.style.background || el.style.backgroundImage || '';
    if (bg.includes('gradient')) return bg;
    return '';
  } catch(e) { return ''; }
}

function extractFirstColor(el) {
  try {
    const bg = el.style.background || el.style.backgroundColor || '';
    const m = bg.match(/#[0-9a-f]{3,6}/i);
    return m ? m[0] : '#667eea';
  } catch(e) { return '#667eea'; }
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function elementId(el) {
  return el.dataset.editLabel?.replace(/\s+/g, '_') || Math.random().toString(36).slice(2);
}

function cssSel(el) {
  if (el.id) return '#' + el.id;
  const parts = [];
  let cur = el;
  while (cur && cur.nodeType === 1 && cur !== frameDoc().body) {
    let sel = cur.tagName.toLowerCase();
    if (cur.className) {
      const c = Array.from(cur.classList).find(c => !['editing','active'].includes(c));
      if (c) sel += '.' + c;
    }
    const siblings = cur.parentNode?.children;
    if (siblings && Array.from(siblings).filter(s => s.tagName === cur.tagName).length > 1) {
      const idx = Array.from(siblings).indexOf(cur) + 1;
      sel += `:nth-child(${idx})`;
    }
    parts.unshift(sel);
    cur = cur.parentNode;
  }
  return parts.join(' > ');
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); publishChanges(); }
});

// ── TOAST ──
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
