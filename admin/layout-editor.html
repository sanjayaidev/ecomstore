<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Layout Editor</title>
    <style>
        :root {
            --primary: #008060; /* Shopify Green */
            --bg: #f1f2f4;
            --surface: #ffffff;
            --border: #dfe3e8;
            --text: #202223;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* Sidebar (Tools) */
        .sidebar {
            width: 300px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .draggable-item {
            background: #fff;
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .draggable-item:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .draggable-item:active {
            cursor: grabbing;
        }

        .drag-handle {
            color: #919eab;
            cursor: grab;
        }

        .add-section-btn {
            margin: 15px;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
        }

        .add-section-btn:hover {
            opacity: 0.9;
        }

        /* Main Preview Area */
        .preview-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .device-frame {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            min-height: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .rendered-section {
            position: relative;
            border: 2px solid transparent;
            transition: border 0.2s;
        }

        .rendered-section:hover {
            border: 2px dashed var(--primary);
        }

        .rendered-section:hover .section-controls {
            opacity: 1;
        }

        .section-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .control-btn:hover {
            background: #f1f2f4;
        }

        .control-btn.delete { color: #d82c0d; }
        .control-btn.edit { color: var(--primary); }

        /* Properties Panel (Right) */
        .properties-panel {
            width: 320px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            display: none; /* Hidden by default */
        }

        .properties-panel.active {
            display: block;
        }

        .prop-group {
            margin-bottom: 20px;
        }

        .prop-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #637381;
        }

        .prop-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .save-bar {
            position: fixed;
            bottom: 20px;
            right: 340px;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1000;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Mock Section Styles for Preview */
        .sec-hero { background: #f8f9fa; padding: 60px 20px; text-align: center; }
        .sec-featured { padding: 40px 20px; }
        .sec-banner { background: #e3f2fd; padding: 40px 20px; text-align: center; }
        .grid-products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
        .prod-card { background: #eee; height: 150px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Left Sidebar: Available Sections -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Theme Sections</span>
            <small style="color:#666">Drag to add</small>
        </div>
        <div class="section-list" id="availableSections">
            <!-- Draggable Templates -->
            <div class="draggable-item" draggable="true" data-type="hero">
                <span class="drag-handle">☰</span>
                <strong>Image Hero</strong>
            </div>
            <div class="draggable-item" draggable="true" data-type="featured_collection">
                <span class="drag-handle">☰</span>
                <strong>Featured Products</strong>
            </div>
            <div class="draggable-item" draggable="true" data-type="promo_banner">
                <span class="drag-handle">☰</span>
                <strong>Promo Banner</strong>
            </div>
            <div class="draggable-item" draggable="true" data-type="newsletter">
                <span class="drag-handle">☰</span>
                <strong>Newsletter Signup</strong>
            </div>
            <div class="draggable-item" draggable="true" data-type="testimonials">
                <span class="drag-handle">☰</span>
                <strong>Testimonials</strong>
            </div>
        </div>
        <button class="add-section-btn" onclick="resetLayout()">Reset Layout</button>
    </div>

    <!-- Center: Live Preview -->
    <div class="preview-area">
        <div class="device-frame" id="canvas">
            <!-- Sections will be rendered here -->
            <div style="padding: 50px; text-align: center; color: #999;" id="empty-state">
                Drag sections from the left to start building your page.
            </div>
        </div>
    </div>

    <!-- Right: Properties Editor -->
    <div class="properties-panel" id="propertiesPanel">
        <h3>Edit Section</h3>
        <div id="propForm">
            <!-- Dynamic Inputs generated here -->
        </div>
        <button class="btn-save" style="width:100%; margin-top:20px;" onclick="closePanel()">Done</button>
    </div>

    <!-- Floating Save Bar -->
    <div class="save-bar">
        <span id="statusText" style="font-size: 0.9rem; color: #666;">Unsaved changes</span>
        <button class="btn-save" id="saveBtn" onclick="saveLayout()" disabled>Save Changes</button>
    </div>

    <script>
        // State
        let layoutData = [];
        let hasChanges = false;
        let activeSectionId = null;

        const canvas = document.getElementById('canvas');
        const propPanel = document.getElementById('propertiesPanel');
        const propForm = document.getElementById('propForm');
        const saveBtn = document.getElementById('saveBtn');
        const statusText = document.getElementById('statusText');

        // Initialize
        async function init() {
            await loadLayout();
            setupDragAndDrop();
        }

        // 1. Load Layout from API
        async function loadLayout() {
            try {
                // In production, replace with actual API call
                // const res = await fetch('/api/layout-sections');
                // layoutData = await res.json();
                
                // Mock Data for demonstration if API is empty
                layoutData = [
                    { id: 'sec_1', type: 'hero', settings: { title: 'Summer Sale', subtitle: 'Up to 50% Off', bg_color: '#f4f4f4' } },
                    { id: 'sec_2', type: 'featured_collection', settings: { collection_id: 'all', limit: 4, title: 'Trending Now' } }
                ];
                
                renderCanvas();
            } catch (e) {
                console.error("Failed to load layout", e);
            }
        }

        // 2. Render Canvas
        function renderCanvas() {
            canvas.innerHTML = '';
            if (layoutData.length === 0) {
                canvas.innerHTML = '<div style="padding: 50px; text-align: center; color: #999;" id="empty-state">Drag sections from the left to start building your page.</div>';
                return;
            }

            layoutData.forEach((section, index) => {
                const el = document.createElement('div');
                el.className = 'rendered-section';
                el.dataset.id = section.id;
                el.dataset.index = index;
                
                // Visual Representation based on Type
                let content = '';
                if (section.type === 'hero') {
                    content = `
                        <div class="sec-hero" style="background:${section.settings.bg_color || '#f8f9fa'}">
                            <h1>${section.settings.title || 'Hero Title'}</h1>
                            <p>${section.settings.subtitle || 'Subtitle goes here'}</p>
                            <button style="padding:10px 20px; background:#000; color:#fff; border:none;">Shop Now</button>
                        </div>`;
                } else if (section.type === 'featured_collection') {
                    content = `
                        <div class="sec-featured">
                            <h2>${section.settings.title || 'Featured Collection'}</h2>
                            <div class="grid-products">
                                ${Array(section.settings.limit || 4).fill('<div class="prod-card"></div>').join('')}
                            </div>
                        </div>`;
                } else if (section.type === 'promo_banner') {
                    content = `
                        <div class="sec-banner">
                            <h3>${section.settings.text || 'Special Offer'}</h3>
                        </div>`;
                } else {
                    content = `<div style="padding:40px; background:#eee; text-align:center">[${section.type.toUpperCase()} Section]</div>`;
                }

                el.innerHTML = `
                    ${content}
                    <div class="section-controls">
                        <button class="control-btn edit" onclick="editSection('${section.id}')">Edit</button>
                        <button class="control-btn" onclick="moveSection(${index}, -1)">↑</button>
                        <button class="control-btn" onclick="moveSection(${index}, 1)">↓</button>
                        <button class="control-btn delete" onclick="deleteSection('${section.id}')">✕</button>
                    </div>
                `;
                canvas.appendChild(el);
            });
        }

        // 3. Drag and Drop Logic (Adding new sections)
        function setupDragAndDrop() {
            const draggables = document.querySelectorAll('.draggable-item');
            
            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', () => {
                    draggable.classList.add('dragging');
                });

                draggable.addEventListener('dragend', () => {
                    draggable.classList.remove('dragging');
                });
            });

            canvas.addEventListener('dragover', e => {
                e.preventDefault();
                const dragging = document.querySelector('.dragging');
                if (dragging) {
                    // Visual cue could be added here
                }
            });

            canvas.addEventListener('drop', e => {
                e.preventDefault();
                const dragging = document.querySelector('.dragging');
                if (dragging) {
                    const type = dragging.dataset.type;
                    addNewSection(type);
                }
            });
        }

        // 4. Add New Section
        function addNewSection(type) {
            const newId = 'sec_' + Date.now();
            let defaultSettings = {};

            if (type === 'hero') defaultSettings = { title: 'Welcome', subtitle: 'New Collection', bg_color: '#ffffff' };
            if (type === 'featured_collection') defaultSettings = { title: 'Featured', limit: 4, collection_id: 'all' };
            if (type === 'promo_banner') defaultSettings = { text: 'Free Shipping on orders over $50' };

            layoutData.push({
                id: newId,
                type: type,
                settings: defaultSettings
            });

            hasChanges = true;
            updateSaveState();
            renderCanvas();
        }

        // 5. Edit Section (Open Side Panel)
        window.editSection = function(id) {
            const section = layoutData.find(s => s.id === id);
            if (!section) return;

            activeSectionId = id;
            propPanel.classList.add('active');
            propForm.innerHTML = '';

            // Generate Inputs based on settings
            for (const [key, value] of Object.entries(section.settings)) {
                const group = document.createElement('div');
                group.className = 'prop-group';
                
                const label = document.createElement('label');
                label.className = 'prop-label';
                label.innerText = key.replace('_', ' ').toUpperCase();
                
                const input = document.createElement('input');
                input.className = 'prop-input';
                input.value = value;
                input.dataset.key = key;
                
                input.addEventListener('input', (e) => {
                    section.settings[key] = e.target.value;
                    hasChanges = true;
                    updateSaveState();
                    renderCanvas(); // Live preview update
                });

                group.appendChild(label);
                group.appendChild(input);
                propForm.appendChild(group);
            }
        };

        window.closePanel = function() {
            propPanel.classList.remove('active');
            activeSectionId = null;
        };

        // 6. Move/Delete
        window.moveSection = function(index, direction) {
            if (direction === -1 && index === 0) return;
            if (direction === 1 && index === layoutData.length - 1) return;

            const temp = layoutData[index];
            layoutData[index] = layoutData[index + direction];
            layoutData[index + direction] = temp;

            hasChanges = true;
            updateSaveState();
            renderCanvas();
        };

        window.deleteSection = function(id) {
            if(!confirm('Delete this section?')) return;
            layoutData = layoutData.filter(s => s.id !== id);
            if (activeSectionId === id) closePanel();
            hasChanges = true;
            updateSaveState();
            renderCanvas();
        };

        window.resetLayout = function() {
            if(confirm('Clear all sections?')) {
                layoutData = [];
                hasChanges = true;
                updateSaveState();
                renderCanvas();
            }
        };

        // 7. Save to API
        async function saveLayout() {
            saveBtn.disabled = true;
            saveBtn.innerText = 'Saving...';
            
            try {
                // Prepare payload for API
                const payload = layoutData.map((item, index) => ({
                    ...item,
                    order: index
                }));

                // REAL API CALL:
                // const res = await fetch('/api/layout-sections/bulk', {
                //     method: 'POST',
                //     headers: {'Content-Type': 'application/json'},
                //     body: JSON.stringify(payload)
                // });
                
                // Simulating API delay
                await new Promise(r => setTimeout(r, 800));
                
                console.log('Saved Layout:', payload);
                alert('Layout saved successfully!');
                hasChanges = false;
                updateSaveState();
            } catch (e) {
                alert('Error saving layout');
                console.error(e);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Save Changes';
            }
        }

        function updateSaveState() {
            saveBtn.disabled = !hasChanges;
            statusText.innerText = hasChanges ? 'Unsaved changes' : 'All changes saved';
            statusText.style.color = hasChanges ? '#d82c0d' : '#008060';
        }

        // Start
        init();
    </script>
</body>
</html>
